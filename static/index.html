<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perch</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/app.css?v=10">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="mark" src="/logo.png" alt="Perch">
      <p id="summary">Connecting…</p>
    </div>
    <div class="top-actions">
      <p id="disk" class="disk"></p>
      <button id="settings-button" type="button" hidden>Settings</button>
      <button id="logout-button" type="button" hidden>Sign out</button>
    </div>
  </header>
  <p id="banner" class="banner" hidden></p>
  <main id="app"></main>
  <script src="/app.js?v=10"></script>
  <script src="/settings.js?v=10"></script>
</body>
</html>
